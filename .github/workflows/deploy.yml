name: Deploy to Cloudflare Pages

# Every push to main publishes beesmotion.com automatically.
# To redeploy by hand: GitHub > Actions > "Deploy to Cloudflare Pages" > Run workflow.
# Needs two repository secrets: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in Settings > Secrets and variables > Actions."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Prepare clean site copy
        run: |
          mkdir -p ../publish/site
          rsync -a \
            --exclude node_modules --exclude .git --exclude .github --exclude .cursor \
            --exclude '*.command' --exclude '.*-log.txt' --exclude .DS_Store \
            --exclude functions --exclude docs --exclude scripts \
            --exclude README.md --exclude package.json --exclude package-lock.json --exclude nixpacks.toml \
            ./ ../publish/site/
          cp -R functions ../publish/functions
          echo "Files: $(find ../publish/site -type f | wc -l)"
      - name: Deploy
        working-directory: ../publish
        run: npx -y wrangler@4 pages deploy site --project-name=beesmotion --branch=main --commit-hash="$GITHUB_SHA" --commit-message="${GITHUB_SHA::7}" --commit-dirty=true
