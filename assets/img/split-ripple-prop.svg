  <g stroke="#9ca3af" stroke-width="1" opacity="0.28" fill="none">
    <path d="M-30 130 C70 80 150 190 255 130 S420 70 510 140"/>
    <path d="M-30 200 C85 145 165 260 270 195 S435 125 510 210"/>
    <path d="M-30 270 C95 210 175 330 285 265 S450 195 510 280"/>
    <path d="M-30 740 C80 685 175 805 280 745 S440 685 510 760"/>
    <path d="M-30 810 C90 755 180 875 290 815 S450 755 510 830"/>
  </g>
