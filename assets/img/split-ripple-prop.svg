    <path d="M40 30 V870 M120 30 V870 M200 30 V870 M280 30 V870 M360 30 V870 M440 30 V870"/>
    <path d="M20 80 H460 M20 200 H460 M20 320 H460 M20 440 H460 M20 560 H460 M20 680 H460 M20 800 H460" opacity="0.45"/>
