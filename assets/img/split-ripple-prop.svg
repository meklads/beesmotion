  </defs>
  <rect width="480" height="900" fill="url(#propGlow)"/>
  <!-- Graphite topographic rings -->
  <g stroke="#6b7280" stroke-width="1.15" fill="none" opacity="0.2">
    <circle cx="240" cy="380" r="48">
      <animate attributeName="r" values="48;58;48" dur="6.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.26;0.1;0.26" dur="6.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="240" cy="380" r="102"/>
    <circle cx="240" cy="380" r="166"/>
    <circle cx="240" cy="380" r="240"/>
    <circle cx="240" cy="380" r="324"/>
  </g>
